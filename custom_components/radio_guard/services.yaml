backup_now:
  fields:
    source:
      required: false
      selector:
        select:
          translation_key: source
          options:
            - zigbee2mqtt
            - zha
            - zwave_js

list_backups:
  fields:
    source:
      required: false
      selector:
        select:
          translation_key: source
          options:
            - zigbee2mqtt
            - zha
            - zwave_js

restore:
  fields:
    source:
      required: true
      selector:
        select:
          translation_key: source
          options:
            - zigbee2mqtt
            - zha
            - zwave_js
    file:
      required: false
      example: "20261107T031700Z.nvm"
      selector:
        text:
    mode:
      required: false
      default: dry_run
      selector:
        select:
          translation_key: mode
          options:
            - dry_run
            - restore
    force:
      required: false
      default: false
      advanced: true
      selector:
        boolean:
